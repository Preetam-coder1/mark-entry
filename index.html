<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Sheet</title>

    <link rel="stylesheet" href="style.css">

    <!-- Excel Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Student Marks Sheet</h1>

        <div class="form-box">

            <div class="input-group">
                <label>Name</label>
                <input type="text" id="name" placeholder="Enter student name">
            </div>

            <div class="input-group">
                <label>College</label>
                <input type="text" id="college" placeholder="Enter college name">
            </div>

            <div class="input-group">
                <label>Roll</label>
                <input type="text" id="roll" placeholder="Enter roll number">
            </div>

            <div class="input-group">
                <label>Marks</label>
                <input type="number" id="marks" placeholder="Enter marks">
            </div>

            <button onclick="addStudent()">Add Student</button>

        </div>


        <!-- Student Table -->

        <div class="table-container">

            <table id="studentTable">

                <thead>
                    <tr>
                        <th>SL</th>
                        <th>Name</th>
                        <th>College</th>
                        <th>Roll</th>
                        <th>Marks</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                </tbody>

            </table>

        </div>


        <button class="download-btn" onclick="downloadExcel()">
            Download Excel
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
