<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Sheet</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Student Marks Sheet</h1>

        <!-- ================= INPUT FORM ================= -->

        <div class="form-box">

            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter name" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="college">College</label>
                <input type="text" id="college" placeholder="Enter college" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="roll">Roll</label>
                <input type="text" id="roll" placeholder="Enter roll" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="marks">Marks</label>
                <input type="number" id="marks" placeholder="Enter marks" min="0" max="100">
            </div>

            <button id="addBtn">
                <i class="fa-solid fa-plus"></i>
                Add Student
            </button>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="search-box">

            <label for="searchInput">Search Student</label>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by Name or Roll..."
                autocomplete="off"
            >

        </div>


        <!-- ================= STUDENT TABLE ================= -->

        <div class="table-container">

            <table id="studentTable">

                <thead>
                    <tr>
                        <th>SL</th>
                        <th>Name</th>
                        <th>College</th>
                        <th>Roll</th>
                        <th>Marks</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                </tbody>

            </table>

        </div>


        <!-- ================= EXCEL ACTIONS ================= -->

        <div class="excel-actions">

            <!-- IMPORT -->
            <div class="excel-box">

                <h3>Import Data</h3>

                <input
                    type="file"
                    id="excelFile"
                    accept=".xlsx, .xls"
                    hidden
                >

                <button class="import-btn" id="importBtn">
                    <i class="fa-solid fa-file-import"></i>
                    Import Excel
                </button>

            </div>


            <!-- DOWNLOAD -->
            <div class="excel-box">

                <h3>Export Data</h3>

                <button class="download-btn" id="downloadBtn">
                    <i class="fa-solid fa-download"></i>
                    Download Excel
                </button>

            </div>

        </div>


        <!-- ================= FOOTER ================= -->

        <footer class="footer">

            <p>
                © 2026 Student Marks Sheet. All Rights Reserved.
            </p>

            <p class="developer">
                Developed by
                <a href="https://github.com/Preetam-coder1" target="_blank">
                    Preetam Aich
                </a>
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
